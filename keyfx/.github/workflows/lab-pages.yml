# Publishes lab/ to GitHub Pages at https://theo-erickson.github.io/keyfx/
name: Lab on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['lab/**', '.github/workflows/lab-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: lab
      - id: deployment
        uses: actions/deploy-pages@v5
